name: Selenium tests

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.bugs || 'clean' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bugs: ""
            expect_fail: ""
          - bugs: allergy
            expect_fail: test_allergies_preserved_after_save
          - bugs: dob
            expect_fail: test_future_dob_is_rejected

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the app
        run: python -m http.server 8001 --directory docs > server.log 2>&1 &

      - name: Wait for the app
        run: curl --retry 10 --retry-delay 1 --retry-connrefused -sf http://localhost:8001 > /dev/null

      - name: Run tests
        continue-on-error: true
        run: pytest -v --bugs=${{ matrix.bugs }} --junitxml=results.xml --html=report.html --self-contained-html

      - name: Check the right tests failed
        run: python ci/check_results.py results.xml "${{ matrix.expect_fail }}"
